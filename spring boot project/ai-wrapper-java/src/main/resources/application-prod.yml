spring:
  datasource:
    # Set these values in Render's Environment tab; never commit real credentials.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Creates the tables for a new hosted database. Change to "validate" once stable.
      ddl-auto: update

server:
  port: ${PORT:8080}
